name: Sync to Hugging Face Space

# Mirrors main into a Hugging Face Space so deploys are just `git push` here.
# Requires, in this repo's settings:
#   Secrets  -> HF_TOKEN   a write token from huggingface.co/settings/tokens
#   Variables-> HF_SPACE   the Space id, e.g. chrissie/athena-research-agent
# Until both exist the job no-ops, so the workflow is inert if you never set it up.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable is unset - nothing to sync."
            exit 0
          fi
          owner="${HF_SPACE%%/*}"
          # The Space is a mirror of this branch, so its history is replaced wholesale.
          git push --force "https://${owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main:main
          echo "Synced to https://huggingface.co/spaces/${HF_SPACE}"
